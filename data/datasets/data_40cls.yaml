# 40类垃圾分类数据集配置
# 基于YOLOv8的垃圾目标检测算法 - 精细化识别版本
# 注意：此配置基于原始数据集的40个类别

# path: . 表示相对于此yaml文件所在目录
path: .
train: images/train
val: images/val

# 类别数量
nc: 40

# 类别名称（基于原始数据集class_id 0-39）
# 分类说明：
# - 厨余垃圾（湿垃圾）：食物残渣、果皮、蔬菜等有机物
# - 可回收物：塑料、纸类、金属、玻璃等可再利用材料
# - 有害垃圾：电池、药品、化学品容器等
# - 其他垃圾：不属于以上三类的生活垃圾

names:
  # 可回收物 - 塑料制品
  0: plastic_container_1      # 塑料容器1
  1: plastic_container_2      # 塑料容器2
  2: plastic_box              # 塑料盒
  3: plastic_tray             # 塑料托盘
  4: plastic_cup              # 塑料杯
  5: plastic_bottle           # 塑料瓶
  6: plastic_bag              # 塑料袋
  7: plastic_wrap             # 保鲜膜/塑料包装
  
  # 厨余垃圾 - 食物类
  8: fruit_peel               # 果皮
  9: vegetable_waste          # 蔬菜残渣
  10: tea_leaves              # 茶叶渣
  11: food_residue            # 食物残渣
  12: bone                    # 骨头
  13: eggshell                # 蛋壳
  
  # 可回收物 - 纸类
  14: paper_box               # 纸盒
  15: carton                  # 纸箱
  16: paper_bag               # 纸袋
  17: newspaper               # 报纸
  18: tissue                  # 餐巾纸（污染后为其他垃圾）
  
  # 可回收物 - 金属
  19: metal_can_1             # 金属罐1
  20: metal_can_2             # 金属罐2
  21: aluminum_foil           # 铝箔
  22: tin_can                 # 罐头盒
  23: zip_top_can             # 易拉罐
  
  # 可回收物 - 玻璃
  24: glass_bottle            # 玻璃瓶
  25: glass_jar               # 玻璃罐
  
  # 其他垃圾 - 一次性用品
  26: disposable_chopsticks   # 一次性筷子
  27: disposable_tableware    # 一次性餐具
  28: cigarette_butt          # 烟头
  29: straw                   # 吸管
  30: toothpick               # 牙签
  
  # 其他垃圾 - 杂项
  31: broken_ceramic          # 碎陶瓷
  32: dust_debris             # 灰尘杂物
  33: worn_fabric             # 破旧织物
  34: rubber_band             # 橡皮筋
  35: pen                     # 笔
  36: battery_shell           # 电池外壳
  
  # 有害垃圾
  37: battery                 # 电池
  38: chemical_bottle         # 化学品瓶
  39: expired_medicine        # 过期药品
